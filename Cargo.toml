[package]
name = "voice-assistant"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Локальный голосовой помощник. Слышит фразу, выполняет команды и ведёт чат."
publish = false

[dependencies]
cpal = "0.15"
ctrlc = "3.4"
hound = "3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
